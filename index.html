<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WebAR Viewer</title>
    
    <!-- Official Model Viewer Script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #f7f7f7; 
            font-family: sans-serif; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
        #ar-button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 20px; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold; 
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        #model-select {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 16px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            outline: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Dropdown menu with corrected values and labels -->
    <select id="model-select">
        <option value="WHITE SOFA MEDIUM SIZE.glb">White Sofa (Medium)</option>
        <option value="RED SOFA.glb">Red Sofa</option>
    </select>

    <!-- Updated model-viewer with floor anchoring & native AR priorities -->
    <model-viewer 
        id="viewer"
        src="WHITE SOFA MEDIUM SIZE.glb" 
        ar 
        ar-placement="floor"
        ar-modes="scene-viewer quick-look webxr" 
        camera-controls 
        touch-action="pan-y" 
        alt="A 3D Model">
        <button slot="ar-button" id="ar-button">✨ View in your Space</button>
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');
        const select = document.getElementById('model-select');

        select.addEventListener('change', (event) => {
            viewer.src = event.target.value;
        });
    </script>

</body>
</html>
