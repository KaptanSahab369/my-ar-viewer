<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WebAR Viewer</title>
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f7f7f7; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; }
        #ar-button { background-color: #007bff; color: white; border: none; border-radius: 20px; padding: 12px 24px; font-size: 16px; font-weight: bold; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- This streams your model securely without download interfaces -->
    <model-viewer 
        src="YOUR_DIRECT_GOOGLE_DRIVE_LINK" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y" 
        alt="A 3D Model">
        <button slot="ar-button" id="ar-button">✨ View in your Space</button>
    </model-viewer>

</body>
</html>
